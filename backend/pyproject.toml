[project]
name = "caso-rag-backend"
version = "1.0.0"
description = "CASO-RAG: A Self-Organizing, Context-Aware Hybrid Graph-Vector Retrieval Engine"
authors = [{ name = "Rishabh Mathur" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Web & API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
    # Database Clients
    "qdrant-client>=1.11.0",
    "neo4j>=5.23.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    # LLM & Embeddings (HuggingFace stack)
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.3",
    "sentence-transformers>=3.0.1",
    "llama-cpp-python>=0.2.90",
    # Responsible AI
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "detoxify>=0.5.2",
    "guardrails-ai>=0.5.0",
    "nltk>=3.9.1",
    # LLMOps & Metrics
    "mlflow>=2.16.0",
    "langfuse>=2.45.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "huggingface-hub>=1.30.0",
    "httpx>=0.28.1",
    "flagembedding>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2"
]
